<svg width="800" height="220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6fa8"/>
      <stop offset="50%" style="stop-color:#ff9cc2"/>
      <stop offset="100%" style="stop-color:#ffd6e7"/>
    </linearGradient>
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:white;stop-opacity:0">
        <animate attributeName="offset" values="-1;2" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="30%" style="stop-color:white;stop-opacity:0.15">
        <animate attributeName="offset" values="-0.7;2.3" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="60%" style="stop-color:white;stop-opacity:0">
        <animate attributeName="offset" values="-0.4;2.6" dur="3s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="800" height="220" fill="url(#bg)" rx="14"/>
  <!-- shimmer overlay -->
  <rect width="800" height="220" fill="url(#shimmer)" rx="14"/>

  <!-- floating circles -->
  <circle cx="80" cy="55" r="55" fill="white" fill-opacity="0.07">
    <animate attributeName="cy" values="55;45;55" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="720" cy="160" r="70" fill="white" fill-opacity="0.06">
    <animate attributeName="cy" values="160;170;160" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="400" cy="15" r="35" fill="white" fill-opacity="0.05">
    <animate attributeName="cy" values="15;25;15" dur="3.5s" repeatCount="indefinite"/>
  </circle>

  <!-- floating petals -->
  <text x="120" y="80" font-size="22" fill-opacity="0.5">🌸
    <animate attributeName="y" values="80;65;80" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="0.5;0.9;0.5" dur="3s" repeatCount="indefinite"/>
  </text>
  <text x="650" y="60" font-size="18" fill-opacity="0.5">🌸
    <animate attributeName="y" values="60;48;60" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="0.5;0.85;0.5" dur="4s" repeatCount="indefinite"/>
  </text>
  <text x="55" y="155" font-size="15" fill-opacity="0.4">✨
    <animate attributeName="y" values="155;145;155" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="0.4;0.8;0.4" dur="3.2s" repeatCount="indefinite"/>
  </text>
  <text x="730" y="100" font-size="15" fill-opacity="0.4">✨
    <animate attributeName="y" values="100;90;100" dur="2.8s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="0.4;0.8;0.4" dur="2.8s" repeatCount="indefinite"/>
  </text>

  <!-- main title with fade-in -->
  <text x="400" y="100" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="bold"
        fill="white" text-anchor="middle"
        style="filter:drop-shadow(0 3px 8px rgba(150,30,70,0.3))">
    hi, i'm dysa 🌸
    <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
  </text>

  <!-- subtitle with delayed fade-in -->
  <text x="400" y="140" font-family="Georgia, serif" font-size="16"
        fill="rgba(255,255,255,0.9)" text-anchor="middle" font-style="italic" opacity="0">
    building things with love &amp; curiosity ✨
    <animate attributeName="opacity" values="0;0;0.9" dur="2s" fill="freeze"/>
  </text>

  <!-- animated wave bottom -->
  <path fill="white" fill-opacity="0.08">
    <animate attributeName="d"
      values="M0,185 Q200,165 400,185 Q600,205 800,180 L800,220 L0,220 Z;
              M0,180 Q200,200 400,178 Q600,160 800,188 L800,220 L0,220 Z;
              M0,185 Q200,165 400,185 Q600,205 800,180 L800,220 L0,220 Z"
      dur="5s" repeatCount="indefinite"/>
  </path>

  <!-- dot decorations -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="2.5s" fill="freeze"/>
    <circle cx="330" cy="172" r="3.5" fill="white" fill-opacity="0.55"/>
    <circle cx="352" cy="172" r="4.5" fill="white" fill-opacity="0.85"/>
    <circle cx="376" cy="172" r="3.5" fill="white" fill-opacity="0.55"/>
    <circle cx="400" cy="172" r="4.5" fill="white" fill-opacity="0.85"/>
    <circle cx="424" cy="172" r="3.5" fill="white" fill-opacity="0.55"/>
    <circle cx="448" cy="172" r="4.5" fill="white" fill-opacity="0.85"/>
    <circle cx="470" cy="172" r="3.5" fill="white" fill-opacity="0.55"/>
  </g>
</svg>
