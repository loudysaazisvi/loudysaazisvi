<svg width="800" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6fa8"/>
      <stop offset="50%" style="stop-color:#ff9cc2"/>
      <stop offset="100%" style="stop-color:#ffd6e7"/>
    </linearGradient>
    <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6fa8;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#fff;stop-opacity:0.1"/>
    </linearGradient>
  </defs>
  
  <!-- background -->
  <rect width="800" height="200" fill="url(#bg)" rx="12"/>
  
  <!-- decorative circles -->
  <circle cx="60" cy="50" r="60" fill="white" fill-opacity="0.08"/>
  <circle cx="750" cy="160" r="80" fill="white" fill-opacity="0.07"/>
  <circle cx="400" cy="10" r="40" fill="white" fill-opacity="0.06"/>
  <circle cx="700" cy="40" r="30" fill="white" fill-opacity="0.09"/>
  <circle cx="100" cy="170" r="35" fill="white" fill-opacity="0.06"/>
  
  <!-- wave shape bottom -->
  <path d="M0,160 Q200,130 400,155 Q600,180 800,145 L800,200 L0,200 Z" fill="white" fill-opacity="0.1"/>
  
  <!-- main text -->
  <text x="400" y="95" font-family="Georgia, serif" font-size="42" font-weight="bold" fill="white" text-anchor="middle" filter="drop-shadow(0 2px 6px rgba(150,30,70,0.25))">hi, i'm dysa 🌸</text>
  
  <!-- subtitle -->
  <text x="400" y="135" font-family="Arial, sans-serif" font-size="16" fill="rgba(255,255,255,0.88)" text-anchor="middle" font-style="italic">building things with love &amp; curiosity ✨</text>
  
  <!-- dots decoration -->
  <circle cx="340" cy="162" r="4" fill="white" fill-opacity="0.6"/>
  <circle cx="360" cy="162" r="5" fill="white" fill-opacity="0.9"/>
  <circle cx="380" cy="162" r="4" fill="white" fill-opacity="0.6"/>
  <circle cx="400" cy="162" r="5" fill="white" fill-opacity="0.9"/>
  <circle cx="420" cy="162" r="4" fill="white" fill-opacity="0.6"/>
  <circle cx="440" cy="162" r="5" fill="white" fill-opacity="0.9"/>
  <circle cx="460" cy="162" r="4" fill="white" fill-opacity="0.6"/>
</svg>
